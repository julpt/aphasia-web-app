spring.application.name=aphasia-app
server.port=${PORT:8080}

app.ai.openai-api-key=${OPENAI_API_KEY:}
app.ai.groq-api-key=${GROQ_API_KEY:}
app.ai.together-api-key=${TOGETHER_API_KEY:}
app.ai.gemini-api-key=${GEMINI_API_KEY:}

app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from-address=${EMAIL_FROM:onboarding@resend.dev}

app.cors.allowed-origins=http://localhost:5173,https://ADRESA_RENDER.onrender.com

app.rate-limit.reconstruct.max-requests=10
app.rate-limit.reconstruct.window-seconds=600